  if (view === 'gallery') {

})(window.__ART__, {"rooms":{"platform":{"name":"Platform","brief":"canopy across top rows (dark grey girders, light-blue glass), gas lamp left with yellow halo, maroon/white BLACKMERE sign centre, receding red tail lamps right on black, blue rails converging. fx `rain`.","desc":"A deserted platform under a dripping canopy. The last train's lamps shrink into the rain and are gone. A gas lamp hisses over a sign: BLACKMERE. The waiting room is west; Station Road climbs north into the town."},"waiting_room":{"name":"Waiting Room","brief":"interior, brown panelling, long bench centre (brown/orange), timetable board white on black above, black grate left, torch as a small grey/yellow block on the sill right. No fx.","desc":"A cold waiting room that smells of wet coats and Jeyes Fluid. A wooden bench runs under a timetable nobody has changed since 1979, and the grate has not seen a fire in years. The door east leads back to the platform."},"station_road":{"name":"Station Road","brief":"steep street rising to the top-right, black terraces both sides with dim yellow windows, orange lamp glow at top, wet road in blue/grey streaks. fx `rain`.","desc":"Station Road climbs between blackened terraces. Rain runs down the gutters in a hurry to be somewhere else. North, the lamps of Market Square. East, a humpbacked bridge crosses the canal. The station is south."},"market_square":{"name":"Market Square","brief":"centre stone cross (grey) on cobbles (dark blue/grey dither), left pub frontage with warm yellow windows and a hanging black-sheep sign, right the Police House with a blue lamp, red phone box beside the cross, orange lamp halos. fx `rain`.","desc":"Market Square: wet cobbles, a stone cross, sodium lamps humming orange. The Black Lamb glows to the west; opposite, the blue lamp of the Police House. A phone box waits by the cross. High Street runs north, Station Road south."},"phone_box":{"name":"Phone Box","brief":"interior close-up: black payphone with silver buttons centre, red frame bars edges, fogged glass panes (light grey dither) showing orange blobs outside, scratched four strokes in white beside the phone. fx `rain`.","desc":"A red phone box, glass fogged, smelling of fag ends. The directory has been torn out page by page. A card above the phone says MINIMUM CALL 10p, and someone has scratched four strokes into the paint beside it. The square is out."},"black_lamb":{"name":"The Black Lamb","brief":"warm interior: dark brown beams across top, fire glowing orange-red left, bar centre-right with yellow brass pumps, Maggie as a small figure behind it (light grey hair, purple cardigan), three hunched dark figures at a table. No fx.","desc":"The Black Lamb: low beams, horse brasses, a fire that has seen better winters. Three regulars stare into their mild and do not look up. Behind the bar a stair climbs to the guest rooms. Market Square is east."},"harrows_room":{"name":"Harrow's Room","brief":"small room, window right with blue rain streaks and a black moor silhouette, bed left with pink spread, brown suitcase on it, chair with jacket centre. fx `rain` (in the window cells only is fine).","desc":"Harrow's room: a candlewick bedspread, a gas ring, a window streaming with rain. His suitcase sits on the bed. His jacket hangs on the chair. An ashtray holds six Embassy ends. The stair leads down."},"police_house":{"name":"Police House","brief":"interior: wooden counter across lower third, desk with green-shaded lamp and open white book, big round clock top-centre, blue lamp glow through the window top-left, Pike as a large dark-blue uniformed figure behind the counter (omit him? - no: draw him; the UI shows the same picture after he leaves, so draw the desk scene WITHOUT Pike to stay correct in every state). No fx.","desc":"The front office of the Police House: a counter, a kettle, a wall clock that ticks too loudly, a desk with the occurrence book open on it. Wanted posters curl on a board. The cells are east. The square is west."},"cells":{"name":"Cells","brief":"corridor perspective, grey brick, two cell doors open (dark), black bicycle centre, four white strokes low on the right wall. No fx.","desc":"Two cells, doors open, a bucket in each. A black police bicycle leans in the corridor. Someone has scratched four strokes low on the wall of the far cell, very neat. The front office is west."},"high_street":{"name":"High Street","brief":"street of shuttered shopfronts (grey, brown, one green Co-op sign), wet road, a spire top-right in dark grey against black, the last lamp at the top of the street. fx `rain`.","desc":"High Street: shuttered shops, a Co-op, a butcher's with the blinds down. Chapel Street runs west and Church Lane climbs north-east towards a dark spire. North, the street gives up and becomes the moor road. The square is south."},"chapel_street":{"name":"Chapel Street","brief":"terrace frontage, green door centre with yellow/black tape across in a diagonal, wet pavement, a black ginnel mouth left. fx `rain`.","desc":"Chapel Street. Terraces shoulder to shoulder. Police tape sags across the door of No.13, the fourth house to go dark. A ginnel runs west behind the houses. High Street is east."},"number_13":{"name":"No.13 Chapel Street","brief":"parlour: lace-curtained window left, mantel clock centre-top (white face), four white vertical strokes on patterned wallpaper (dark red/brown dither) right, small yellow stub glow at the bottom, a darker patch on the rug. No fx.","desc":"Ivy Marsh's front room, a week on. Lace, a clock stopped at ten past ten, a dark stain on the hearthrug. On the wall by the hearth four strokes are scratched into the wallpaper. A candle stub has melted to the skirting below. The street is out."},"back_alley":{"name":"Back Alley","brief":"narrow alley, walls both sides in dark brown brick, metal dustbins (grey) left, a back gate centre with white chalk strokes, gravestones visible through a gap top-right. fx `rain`.","desc":"A ginnel behind Chapel Street: wet flags, dustbins, a coal-hole lid. Someone has chalked four strokes on a back gate, and a fifth, half rubbed out. A gap in the wall leads north-east into the churchyard. Chapel Street is east."},"church_lane":{"name":"Church Lane","brief":"lane rising between black-green yew hedges, church tower top-centre with a lit window (yellow), boarded cottage bottom-left. fx `rain`.","desc":"Church Lane climbs between yew hedges to St Jude's. Edna Ashworth's cottage stands dark at the corner, its windows boarded. The church door is north. High Street lies south-west."},"st_judes":{"name":"St Jude's","brief":"nave interior, grey stone arches, yellow candle rack centre-left (four lit), row of small yellow brass rectangles along the right wall, dark stair mouth bottom-right. No fx (optional `flicker` on the candles).","desc":"St Jude's: cold stone, candle smoke and damp hymn books. Fourteen small brass plaques line the north wall. The vestry is east; the porch north opens on the churchyard. Steps lead down to the crypt. The lane is south."},"vestry":{"name":"Vestry","brief":"small room, green lamp glow centre, big open register (white pages, black lines) on a brown desk, dark cassocks hanging left. No fx.","desc":"The vestry: cassocks on hooks, a cupboard of communion wine, a desk under a green-shaded lamp. On the desk lies the burial register of St Jude's, open, its pages foxed with age. The church is west."},"churchyard":{"name":"Churchyard","brief":"tilted grey headstones in dark green grass, white stone girl statue centre on a plinth, church wall/porch right, fog bands across the middle. fx `fog`, `rain`.","desc":"A churchyard drowning in long grass. Headstones lean like tired men. In the middle stands the memorial to the Fourteen: a stone girl with her face worn smooth. The porch is south; a gap in the wall leads south-west to a ginnel."},"crypt":{"name":"Crypt","brief":"low vault in dark grey/brown, torch beam cone (light yellow) from bottom-centre onto the far wall where one stone stands out lighter; coffin shelves in black shapes both sides. No fx.","desc":"A low crypt. Coffin shelves, broken chairs, a hundred years of dust. One stone in the wall sits proud of the others, its mortar picked clean. The steps lead up."},"canal_bridge":{"name":"Canal Bridge","brief":"stone arch spanning the picture, black water below with a single orange lamp reflection, steps descending left. fx `rain`.","desc":"A humpbacked bridge over the canal. The water below is black and perfectly still, as if it were holding its breath. Stone steps lead down to the towpath. Station Road is west."},"towpath":{"name":"Towpath","brief":"path along the canal (black water bottom-third), single white bulb on a pole centre with a yellow halo, brown flowers at its foot, the mill as a huge black block with a chimney on the left horizon. fx `rain`, `fog`.","desc":"The towpath, puddled and lit by a single bulb on a pole. Walter Crabtree died here three weeks ago; someone has left flowers, now brown. East, the lock. West, the black bulk of the mill. Steps climb to the bridge."},"lock":{"name":"Blackmere Lock","brief":"two big brown lock gates converging, white churning water between (white/light-blue dither) far below, a cottage with one yellow window top-left, a shed right. fx `rain`.","desc":"Blackmere Lock: two great timber gates and between them a chamber of black water ten feet down, roaring where it pours through the paddles. Silas's cottage is north, his shed east. The towpath runs west."},"lock_cottage":{"name":"Lock-keeper's Cottage","brief":"cosy cramped interior: orange heater glow bottom-left, rocking chair centre with an old man (grey/brown), clocks (white circles) on shelves across the top, grey dog curled bottom-right. No fx.","desc":"A one-room cottage, hot as an oven. A paraffin heater, a rocking chair, a whippet asleep on an old coat. Every shelf is covered in clocks, and not one of them is going. The door is south."},"shed":{"name":"Silas's Shed","brief":"timber wall with tools hung inside white painted outlines, bolt cutters (long red handles) and an oil can (green with a spout) on a bench centre. No fx.","desc":"Silas's shed: oil, rope ends, rust. Tools hang on nails, each one inside its own outline painted on the boards, so you'd know at once if one were gone. The lock is west."},"moor_road":{"name":"Moor Road","brief":"dark moorland under a black sky, road (grey) diagonal from bottom-left, blue Cortina tilted into the ditch right with its door open, orange town glow bottom-left. fx `fog`.","desc":"The moor road, lit only by the town glow behind you. Heather and black peat on both sides. Nosed into the ditch is a blue Cortina, driver's door open. North, the road climbs on to the moor. The town is south."},"harrows_car":{"name":"Harrow's Car","brief":"interior view from the back seat: dashboard across the bottom, rain-streaked windscreen (blue/black, droplets), dangling handset centre on a curly black cord, silver handcuffs on the passenger seat right. fx `rain`.","desc":"Inside Harrow's Cortina. Cold vinyl, a smell of Embassy and wet dog. The radio handset dangles on its curly cord, hissing. Rain beads the windscreen. The road is out."},"tally_stone":{"name":"The Tally Stone","brief":"tall grey standing stone centre covered in white tally rows, black moor horizon, fog banks drifting, a tiny lit lamp far north (right). fx `fog`, `lightning` (rare flash).","desc":"A standing stone on the crest of the moor, taller than a man and cut from top to bottom with tally marks, hundreds of them, old as weather. The road runs south to town and north to the asylum. A track leads east to the quarry."},"quarry_edge":{"name":"Quarry Edge","brief":"cliff edge in the foreground (grey), a black void dropping below, a rusty iron post leaning right, a tin hut silhouette left, wind-blown rain. fx `rain`, `lightning`.","desc":"The lip of Blackmere Quarry. The face drops sixty feet to black water and spoil heaps. An old winch post leans out over the drop. A tin hut squats behind you. The track runs west to the stone."},"quarry_hut":{"name":"Quarry Hut","brief":"corrugated-tin interior in grey/brown, crowbar (dark grey) leaning in a corner, a coil of rope (light brown) on a nail, calendar (faded pink) on the wall. No fx.","desc":"A tin hut, its door hanging off. A brazier full of rainwater, a calendar from 1968, a workbench with nothing on it but rust and mouse droppings. The quarry edge is out."},"quarry_floor":{"name":"Quarry Floor","brief":"looking up from the floor: quarry walls (grey) on three sides, a sliver of black sky, a rusted car shell (brown) left, a stone ring with grey ash and a small pale book beside it. fx `rain`.","desc":"The quarry floor: black water, spoil heaps, a burnt-out car. In the lee of a boulder someone has made a fire, often - a ring of stones, years of ash. A rough path zig-zags back up to the edge."},"mill_gates":{"name":"Mill Gates","brief":"tall black iron gates centre with ASHWORTH lettering, chain and padlock (silver) at the join, mill silhouette behind with a chimney, a white notice on the gatepost. fx `rain`, `lightning`.","desc":"The gates of Ashworth's Mill: iron, twelve feet high, chained and padlocked. Beyond them the mill rises in black tiers, every window dead. A demolition notice is pasted to the gatepost. The towpath is east."},"mill_yard":{"name":"Mill Yard","brief":"enclosed yard, black mill walls on three sides, one caged lamp (yellow) over a door top-centre, wet cobbles, a dark doorway left (weaving shed), steps down right. fx `rain`.","desc":"The mill yard, cobbled, lit by one lamp that still works over the counting-house door. The weaving shed gapes to the west. The counting house is north. Steps lead down to the boiler room. The gates are south."},"weaving_shed":{"name":"Weaving Shed","brief":"rows of black loom frames receding, a torch cone (light grey/yellow) from the bottom, broken roof lights (blue) above, a faint pale girl figure at the cone's edge (light grey, mostly dithered - keep it ambiguous). fx `flicker`.","desc":"The weaving shed: row on row of dead looms under a roof of broken glass. The east doors are scorched black. Strokes have been scratched into the doors, low down, at a child's height. Lint stirs, though there is no wind."},"counting_house":{"name":"Counting House","brief":"Victorian office, tall desks in brown, a huge black ledger centre on the tallest desk with one pale page sticking out, barred windows right, a round black iron trap with a padlock in the floor bottom-centre. No fx.","desc":"The counting house: high desks, barred wages windows, the smell of ink and mice. On the tallest desk lies a great ledger bound in black. An iron trap is set in the floor, padlocked. The yard is south."},"boiler_room":{"name":"Boiler Room","brief":"two huge riveted boiler cylinders left and right in dark red/brown, a round grey hatch in the floor centre, torch cone from below. No fx.","desc":"The boiler room: two Lancashire boilers like beached whales, pipes, a coal heap, the smell of old fire. In the floor between the boilers is a round iron hatch, rusted to its rim. Steps lead up to the yard."},"asylum_gates":{"name":"Asylum Gates","brief":"chained iron gates in the foreground, long asylum range behind with a clock tower whose face is an empty black circle, a lamp (yellow) over a bricked lodge left, a black chute mouth bottom-right. fx `fog`, `lightning`.","desc":"Ashcombe Asylum, closed 1979. The gates are chained, the lodge bricked up, though a lamp still burns over it for no one. At the foot of the wall a coal chute gapes, its lid long gone. The moor road runs south."},"coal_chute":{"name":"Coal Chute","brief":"cellar, black coal heaps, a shaft of grey light from top-left down the chute, bootprints (dark grey) in lighter dust across the floor, stairs right. No fx.","desc":"The coal cellar at the foot of the chute. Grey light falls from above. Coal dust everywhere, scuffed by boots - recently, and more than once. A stair leads north into the building. You could climb back up the chute."},"entrance_hall":{"name":"Entrance Hall","brief":"tiled floor (black/white checker) in perspective, arched windows letting in pale blue moonlight shafts, a reception hatch centre, a dark stairwell bottom-right. fx `fog`.","desc":"The entrance hall: black and white tiles, a reception hatch, a noticeboard of curling rotas. Moonlight falls through tall windows. Records are west, the ward east. A stair goes down to the morgue. The cellar is south."},"records_office":{"name":"Records Office","brief":"grey steel cabinet centre with a P-R label, shelves of brown boxes either side, orange light through a window top-left, a black typewriter on a desk. No fx.","desc":"Records: shelves of box files, a dead typewriter, and a steel cabinet marked P-R, rusted shut. The lodge lamp outside paints everything orange. The hall is east."},"ward":{"name":"Adolescent Ward","brief":"row of iron bed frames receding left to right, the wall above one bed covered in fine grey pencil tally rows up to the ceiling, torch cone. fx `flicker`.","desc":"The adolescent ward. Twelve iron beds, stripped. On the wall above bed nine, tally marks in pencil, thousands of them, in neat gates of five, climbing to the ceiling. Something drips. The hall is west."},"morgue":{"name":"Morgue","brief":"wall of square steel drawer fronts (light grey, numbered in black), one drawer (4) sticking out, white tiled walls, a slab bottom-left, torch cone. fx `flicker`.","desc":"The morgue: white tiles, a drain in the floor, a slab, and a wall of steel drawers numbered 1 to 8. Drawer 4 does not sit flush with the rest. The stair leads up."},"tunnel":{"name":"Tunnel","brief":"barrel-vaulted brick tunnel in perspective (dark red/brown, black centre), torch cone, small white tally groups on the walls, a studded iron door at the vanishing point. fx `flicker`.","desc":"A brick tunnel, barrel-vaulted, tally marks scratched every few yards. Steps climb south to the morgue; a ladder rises to a hatch overhead. North, an iron door, shut. Behind it, very faint, a man is praying."},"counting_room":{"name":"The Counting Room","brief":"brick vault, four huge white strokes on the back wall, a chained figure (Harrow: grey hair, white shirt with a dark stain) hanging beneath, a long table foreground. Pike is NOT drawn (state varies). fx `flicker`.","desc":"The Counting Room: a brick vault, a long wages table, iron rings in the wall. On the far wall four great strokes are cut deep into the brick, a gate waiting to be closed. Harrow hangs in chains beneath them. The iron door is south."}},"fxFrames":[["rain","market_square",[0,1,2,3]],["lightning","market_square",[67,68,70,71]],["fog","weaving_shed",[0,10,20,30]],["flicker","weaving_shed",[1,0,0,1]]],"briefs":{"title":"\"THE TALLYMAN\" in big block letters (white/light grey) over a black mill silhouette with a chimney, fog bands (grey dither), four tall white strokes and a fifth diagonal in red across them on the right, \"BLACKMERE - NOVEMBER 1984\" small at the bottom. fx `rain`, `lightning`.","ending_victory":"dawn-grey sky over Market Square, the blue lamp, six car shapes with blue flashing roof lights (light blue), small figures; four strokes, no fifth. fx `fog`.","ending_pyrrhic":"the Counting Room wall: four white strokes, chains hanging empty below in grey, a kneeling dark figure at the edge. Muted. No fx.","ending_got_away":"the tally stone on the moor at night with a folded cape at its foot, four small stones on it; fog. fx `fog`.","ending_fifth":"the four strokes with a fifth diagonal in red, closing the gate; nothing else. fx `flicker`.","ending_wrong":"the platform, a train's red tail lamps leaving, a tall uniformed silhouette under the gas lamp, waving. fx `rain`.","ending_death":"black screen, a fallen torch at bottom-left throwing a yellow cone across the floor onto four white strokes. fx `flicker`."},"screenFx":[["title",[0,7,15],"rain"],["title",[67,68,70],"lightning"],["ending_victory",[0,7,15],"fog"],["ending_got_away",[0,7,15],"fog"],["ending_fifth",[0,7,15],"flicker"],["ending_wrong",[0,7,15],"rain"],["ending_death",[0,7,15],"flicker"]],"endings":[{"art":"ending_victory","title":"The Tally Settled"},{"art":"ending_pyrrhic","title":"Paid in Full"},{"art":"ending_got_away","title":"The One That Got Away"},{"art":"ending_fifth","title":"The Fifth Stroke"},{"art":"ending_wrong","title":"The Wrong Man"},{"art":"ending_death","title":"Drowned"},{"art":"ending_death","title":"The Long Drop"},{"art":"ending_death","title":"Counted"}]});
